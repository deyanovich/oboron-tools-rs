[package]
name = "obcrypt-cli"
# 1.0.0: tracks obcrypt 1.0.0 (authenticated-only core; schemes
# dsiv/psiv/dgcmsiv/pgcmsiv, hex-only keys, decrypt requires the
# scheme — no marker auto-detect).
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
description = "Command-line interface for obcrypt — bytes-in/bytes-out authenticated symmetric encryption (the oboron protocol's cryptographic core). Produces the `obcrypt` binary."
keywords = ["cli", "encryption", "cryptography", "oboron"]
categories = ["command-line-utilities", "cryptography"]
readme = "README.md"

[features]
# The four authenticated core schemes obcrypt exposes; the default
# pulls them all in. The feature vocabulary mirrors `obcrypt`.
default = ["dgcmsiv", "pgcmsiv", "dsiv", "psiv"]

# Individual schemes (forwarded to obcrypt)
dgcmsiv = ["obcrypt/dgcmsiv"]
pgcmsiv = ["obcrypt/pgcmsiv"]
dsiv = ["obcrypt/dsiv"]
psiv = ["obcrypt/psiv"]
mock = ["obcrypt/mock"]

[[bin]]
name = "obcrypt"
path = "src/main.rs"

[dependencies]
obcrypt = { workspace = true, default-features = false }
oboron-cli-core.workspace = true
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
dirs.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
