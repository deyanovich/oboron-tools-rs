[package]
name = "oboron-cli"
# 1.0.0: implements oboron CLI spec 1.0, tracking oboron 1.0.1. The
# library is authenticated-only, so this crate produces just the `ob`
# binary over the four authenticated core schemes — dsiv, psiv,
# dgcmsiv, pgcmsiv. The unauthenticated-layer CLI (`obu`) is a separate
# crate. Keys are 128-char hex only; `dec` uses the supplied scheme,
# never auto-detects, and reports every failure through one uniform
# error (spec §8). `--version` prints the spec-mandated single line.
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
description = "CLI for the oboron protocol — string-in/string-out authenticated symmetric encryption with obtext encoding. Produces the `ob` binary."
keywords = ["cli", "encryption", "oboron", "authenticated", "base32"]
categories = ["command-line-utilities", "cryptography"]
readme = "README.md"
exclude = ["tests/", ".github/"]

[features]
default = ["dsiv", "psiv", "dgcmsiv", "pgcmsiv"]

# The four authenticated core schemes. Forwarding to oboron/* gates
# both the wrapper code here and the AES backend pulled by oboron.
dsiv = ["oboron/dsiv"]
psiv = ["oboron/psiv"]
dgcmsiv = ["oboron/dgcmsiv"]
pgcmsiv = ["oboron/pgcmsiv"]
mock = ["oboron/mock"]

# Scheme categories (local aggregation).
authenticated-schemes = ["dsiv", "psiv", "dgcmsiv", "pgcmsiv"]
deterministic-schemes = ["dsiv", "dgcmsiv"]
probabilistic-schemes = ["psiv", "pgcmsiv"]

[[bin]]
name = "ob"
path = "src/main.rs"

[dependencies]
oboron = { workspace = true, features = ["keyless"] }
oboron-cli-core.workspace = true
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
