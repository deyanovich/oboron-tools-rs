[package]
name = "obu-cli"
# 1.0.0: tracks obu 1.0.0 (the oboron family's unauthenticated /
# obfuscation layer). Implements OBU CLI spec 1.0: enc, dec, and
# secretgen over the upcbc/zdcbc schemes, with a 64-hex-character
# secret. Produces the `obu` binary. Conformance lives in the separate
# obu-cli-conformance crate (kept apart from the secure suite).
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
description = "CLI for the oboron obu layer — unauthenticated string-in/string-out codecs (upcbc, zdcbc) with obtext encoding. Produces the `obu` binary. NOT authenticated; never use for sensitive data."
keywords = ["cli", "obfuscation", "encoding", "oboron", "unauthenticated"]
categories = ["command-line-utilities", "encoding"]
readme = "README.md"
exclude = ["tests/", ".github/"]

[features]
# Default: both obu schemes. The CLI built-in default scheme is upcbc.
default = ["upcbc", "zdcbc"]

# Individual schemes (forwarded to obu/*). Gate both the wrapper flags
# here and the AES backend pulled by obu.
upcbc = ["obu/upcbc"]
zdcbc = ["obu/zdcbc"]
mock = ["obu/mock"]

[[bin]]
name = "obu"
path = "src/main.rs"

[dependencies]
obu = { workspace = true, features = ["keyless"] }
oboron-cli-core.workspace = true
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
