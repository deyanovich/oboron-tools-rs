[workspace]
members = ["oboron-cli-core", "oboron-cli", "obcrypt-cli", "obu-cli", "oboron-cli-conformance", "obu-cli-conformance"]
resolver = "2"

# Release / bench profiles at the workspace level so they actually
# apply (Cargo silently ignores per-package profiles on non-root
# members). LTO is important for the consumers that path-dep on the
# oboron / obcrypt library crates — without it, cross-crate inlining
# of the AEAD hot path doesn't happen.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
inherits = "release"

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.77.0"
license = "MIT OR Apache-2.0"
repository = "https://gitlab.com/oboron/oboron-tools-rs"
homepage = "https://oboron.org/"
documentation = "https://oboron.org/"
authors = ["Bojan Đuričković"]

[workspace.dependencies]
# Sibling library deps, resolved from crates.io at the pinned
# version.
obcrypt = { version = "1.0.0", default-features = false }
oboron = { version = "1.0.1", default-features = false }
obu = { version = "1.0.0", default-features = false }

# Internal: shared CLI plumbing — published in lockstep with the
# CLIs that depend on it.
oboron-cli-core = { path = "oboron-cli-core", version = "1.0.0" }

# Shared third-party deps
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "cargo"] }
clap_complete = "4.5"
dirs = "5.0"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
