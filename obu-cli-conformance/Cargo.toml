[package]
name = "obu-cli-conformance"
# 1.0.0: conformance suite for the obu CLI (the unauthenticated /
# obfuscation layer), kept separate from the authenticated
# oboron-cli-conformance suite to mirror the segregation of the obu
# library / `obu` binary from the secure core. Covers the obu positive
# vectors (upcbc / zdcbc over every encoding); obu negative-vector
# coverage lands once the test-vectors repo publishes them.
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
description = "Conformance test suite for the obu CLI surface (the oboron protocol's unauthenticated layer). Ships canonical obu test vectors and the `obu-cli-conformance` binary for validating alternative-language implementations."
keywords = ["cli", "conformance", "obfuscation", "oboron", "testing"]
categories = ["command-line-utilities", "development-tools::testing"]
readme = "README.md"

[[bin]]
name = "obu-cli-conformance"
path = "src/bin/obu-cli-conformance.rs"

[features]
default = ["upcbc", "zdcbc"]
upcbc = []
zdcbc = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
